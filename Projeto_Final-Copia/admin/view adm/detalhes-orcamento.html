<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Detalhes do Orçamento - Sabino Gesso</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
  <link rel="stylesheet" href="../css adm/detalhes-orcamentos.css">
</head>
<body>
  <main class="detalhes-orcamento-main">
    <header class="detalhes-topo">
      <div>
        <h1>Detalhes do Orçamento</h1>
        <p id="codigoCabecalho">Carregando...</p>
      </div>
      <a class="btn-voltar" href="orcamentos.html"><i class="bi bi-arrow-left"></i> Voltar aos Orçamentos</a>
    </header>
    <div id="estadoPagina" class="estado-carregamento">Carregando informações do orçamento...</div>
    <div id="conteudoOrcamento" hidden>
      <section class="bloco-detalhes">
        <div class="orcamento-topo">
          <h2 id="tituloOrcamento">Orçamento</h2>
          <span id="statusOrcamento" class="tag-status"></span>
        </div>
        <div id="dadosOrcamento" class="dados-grid"></div>
      </section>
      <section class="bloco-detalhes">
        <h2>Cliente</h2>
        <div id="dadosCliente" class="dados-grid"></div>
      </section>
      <section class="bloco-detalhes">
        <h2>Serviço e local da obra</h2>
        <div id="dadosServico" class="dados-grid"></div>
      </section>
      <section class="bloco-detalhes" id="blocoObservacoes" hidden>
        <h2>Observações</h2>
        <p id="observacoes" class="texto-longo"></p>
      </section>
    </div>
  </main>
  <script src="../js adm/detalhes-orcamento.js"></script>
</body>
</html>
